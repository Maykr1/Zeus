spring: 
  application:
    name: zeus
  profiles:
    active: ${ACTIVE_PROFILE:local}

  http:
    clients:
      connect-timeout: 30s
      read-timeout: 30s

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

elasticsearch:
  index-prefix: ${ELASTICSEARCH_INDEX_PREFIX:-}

zeus:
  location:
    latitude: ${ZEUS_LATITUDE:-0.0}
    longitude: ${ZEUS_LONGITUDE:-0.0}